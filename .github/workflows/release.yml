# Builds the Windows installer on GitHub and publishes it as a GitHub Release.
# Trigger: push a tag that matches the version in package.json, e.g.  git tag v0.1.2 && git push origin v0.1.2
# No personal access token is needed: GITHUB_TOKEN is created by GitHub for each run.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # electron-builder takes owner/repo for the update address from package.json `repository`.
      - name: Point package.json repository at this repo
        shell: bash
        run: npm pkg set repository.type=git repository.url="https://github.com/${GITHUB_REPOSITORY}.git"

      - run: npm ci

      # electron-builder uploads the installer and its blockmap in parallel and both try to create the release; one fails with
      # 422 already_exists and the release ends up missing files. Creating the release first avoids that race.
      - name: Create the GitHub release first
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 0.1.5: the notes start with `schema: N` (N = number of migration files = the database format this release writes). The app's
        # "Choose app version" reads that line so it never offers a version that would leave the owner's bills read-only.
        run: |
          SCHEMA=$(ls src/main/db/migrations/*.sql | wc -l | tr -d ' ')
          if [ "$SCHEMA" -lt 1 ]; then echo "No migration files found"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" --notes "schema: ${SCHEMA}" --generate-notes

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
