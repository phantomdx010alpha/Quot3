<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Country Wars</title>
<style>
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2')}
:root{
  --cream:#f4e8c8; --cream2:#ecdcb0; --sand:#d8be86; --tan:#b8975a;
  --brown:#4a2f1d; --brown2:#6b4128;
  --terra:#b4533a; --terra-d:#8c3d2a;
  --grass:#4f8a38; --sun:#f2b632; --sky:#5ea6d2; --pine:#1f3d22;
  --u:1px; --d:800px; --rowh:40px; --cx:400px; --cy:400px;
  --head:'Lilita One','Arial Black',Impact,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#5b2a1c;font-family:var(--body);color:var(--brown)}
body.idle{cursor:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:var(--terra-d);flex:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}

/* ---------- panel ---------- */
#panel{position:absolute;display:flex;flex-direction:column;gap:calc(10*var(--u));padding:calc(14*var(--u));background:var(--cream);border:calc(4*var(--u)) solid var(--brown);border-radius:calc(22*var(--u));box-shadow:calc(8*var(--u)) calc(8*var(--u)) 0 var(--brown2);min-height:0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:calc(10*var(--u));flex:none}
.title{font-family:var(--head);font-size:calc(50*var(--u));line-height:.88;color:var(--terra);letter-spacing:.02em;text-shadow:calc(3*var(--u)) calc(3*var(--u)) 0 var(--sun)}
.land .title span{display:block}
.meta{display:flex;flex-direction:column;gap:calc(5*var(--u));align-items:flex-end}
.port .meta{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--head);font-size:calc(21*var(--u));padding:calc(2*var(--u)) calc(13*var(--u));border-radius:999px;background:var(--brown);color:var(--cream);white-space:nowrap}
.pill.sun{background:var(--sun);color:var(--brown)}
.pill.sky{background:var(--sky);color:var(--brown)}
.champ{flex:none;display:flex;align-items:center;gap:calc(10*var(--u));background:var(--sun);border:calc(3*var(--u)) solid var(--brown);border-radius:calc(14*var(--u));padding:calc(6*var(--u)) calc(12*var(--u));font-family:var(--head);font-size:calc(24*var(--u));min-height:calc(52*var(--u));white-space:nowrap;overflow:hidden}
.champ svg{height:calc(28*var(--u));width:calc(34*var(--u));flex:none}
.champ img{height:calc(30*var(--u));width:calc(45*var(--u));object-fit:cover;border:calc(2*var(--u)) solid var(--brown);border-radius:calc(4*var(--u));flex:none}
.champ .cn{overflow:hidden;text-overflow:ellipsis}
.champ small{font-size:calc(17*var(--u));margin-left:auto;background:var(--brown);color:var(--cream);border-radius:999px;padding:0 calc(10*var(--u))}
.boards{flex:1;min-height:0;display:flex;gap:calc(12*var(--u))}
.land .boards{flex-direction:column}
.board{display:flex;flex-direction:column;min-height:0;min-width:0}
.land .board.live{flex:1.75}
.land .board.wins{flex:1}
.port .board{flex:1}
.board h3{flex:none;font-family:var(--head);font-weight:400;font-size:calc(20*var(--u));display:flex;justify-content:space-between;color:var(--cream);background:var(--brown);padding:calc(3*var(--u)) calc(10*var(--u));border-radius:calc(8*var(--u));margin-bottom:calc(6*var(--u))}
.board h3 .cols{opacity:.75;font-size:.8em;letter-spacing:.04em}
.rows{position:relative;flex:1;min-height:0;overflow:hidden}
.row{position:absolute;left:0;right:0;top:0;height:calc(var(--rowh) - 4*var(--u));display:flex;align-items:center;gap:calc(8*var(--u));padding:0 calc(10*var(--u)) 0 calc(4*var(--u));background:var(--cream2);border:calc(2*var(--u)) solid var(--tan);border-radius:calc(9*var(--u));font-size:calc(20*var(--u));font-weight:900;transition:transform .45s cubic-bezier(.3,.9,.3,1),opacity .3s,background .3s}
.row.top1{background:var(--sun);border-color:var(--brown)}
.row.strip{opacity:.62}
.row .rk{width:calc(30*var(--u));text-align:center;font-family:var(--head);font-weight:400;flex:none}
.row .fl{height:calc(24*var(--u));width:calc(36*var(--u));object-fit:cover;border:calc(2*var(--u)) solid var(--brown);border-radius:calc(4*var(--u));flex:none}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-family:var(--head);font-weight:400;font-size:calc(25*var(--u));min-width:calc(42*var(--u));text-align:right;color:var(--terra)}
.row .ct{min-width:calc(36*var(--u));text-align:right;opacity:.75;font-size:calc(18*var(--u))}
.row .wn{font-family:var(--head);font-weight:400;font-size:calc(25*var(--u));color:var(--terra)}

/* ---------- overlays ---------- */
.ov{position:absolute;left:var(--cx);top:var(--cy);transform:translate(-50%,-50%);text-align:center;pointer-events:none;display:none;font-family:var(--head);z-index:4}
.card{background:var(--cream);border:calc(var(--d)*.008) solid var(--brown);border-radius:calc(var(--d)*.04);padding:calc(var(--d)*.025) calc(var(--d)*.05);box-shadow:calc(var(--d)*.012) calc(var(--d)*.012) 0 var(--brown2);transform:rotate(-2deg);animation:cardin .5s cubic-bezier(.2,1.4,.4,1)}
.card .k{font-size:calc(var(--d)*.034);color:var(--terra);letter-spacing:.06em}
.card .big{font-size:calc(var(--d)*.088);line-height:.95;color:var(--brown);margin:calc(var(--d)*.006) 0}
.card .sub{font-size:calc(var(--d)*.031);color:var(--brown2)}
.card .count{font-size:calc(var(--d)*.17);line-height:1;color:var(--terra);text-shadow:calc(var(--d)*.006) calc(var(--d)*.006) 0 var(--sun)}
.card img{display:block;margin:calc(var(--d)*.01) auto;height:calc(var(--d)*.17);width:calc(var(--d)*.255);object-fit:cover;border:calc(var(--d)*.008) solid var(--brown);border-radius:calc(var(--d)*.014);box-shadow:calc(var(--d)*.008) calc(var(--d)*.008) 0 var(--brown2)}
.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(1.7);opacity:.2}100%{transform:scale(1);opacity:1}}
@keyframes cardin{0%{transform:rotate(-2deg) scale(.6);opacity:0}100%{transform:rotate(-2deg) scale(1);opacity:1}}
#toasts{position:absolute;left:calc(16*var(--u));top:calc(16*var(--u));display:flex;flex-direction:column;gap:calc(8*var(--u));pointer-events:none;z-index:5}
.toast{display:flex;align-items:center;gap:calc(12*var(--u));background:var(--cream);border:calc(4*var(--u)) solid var(--brown);border-radius:calc(14*var(--u));padding:calc(8*var(--u)) calc(18*var(--u));box-shadow:calc(6*var(--u)) calc(6*var(--u)) 0 var(--brown2);font-family:var(--head);animation:tin 2.7s cubic-bezier(.2,.9,.3,1) forwards}
.toast img{height:calc(46*var(--u));width:calc(69*var(--u));object-fit:cover;border:calc(3*var(--u)) solid var(--brown);border-radius:calc(4*var(--u))}
.toast b{display:block;font-weight:400;font-size:calc(30*var(--u));line-height:1;color:var(--terra)}
.toast small{display:block;font-size:calc(18*var(--u));color:var(--brown);margin-top:calc(2*var(--u))}
.toast.alert{background:var(--sun)}
.toast.alert b{color:var(--brown)}
@keyframes tin{0%{transform:translateX(-130%) rotate(-3deg)}10%{transform:translateX(0) rotate(0)}86%{transform:translateX(0);opacity:1}100%{transform:translateX(-130%);opacity:0}}

/* ---------- settings ---------- */
#gear{position:fixed;left:10px;top:10px;z-index:60;width:42px;height:42px;border-radius:50%;border:3px solid var(--brown);background:var(--cream);box-shadow:3px 3px 0 var(--brown2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#gear svg{width:22px;height:22px}
body.idle #gear{opacity:0}
body.hideui #gear,body.hideui #drawer{display:none}
#drawer{position:fixed;left:0;top:0;bottom:0;width:340px;max-width:92vw;z-index:55;background:var(--cream);border-right:4px solid var(--brown);padding:62px 16px 24px;overflow-y:auto;transform:translateX(-105%);transition:transform .25s ease;font-size:14px;font-weight:800}
#drawer.open{transform:none;box-shadow:8px 0 0 rgba(74,47,29,.35)}
#drawer h4{font-family:var(--head);font-weight:400;font-size:17px;letter-spacing:.05em;background:var(--brown);color:var(--cream);padding:3px 10px;border-radius:8px;margin:18px 0 8px}
#drawer .ctl{display:block;margin-bottom:10px}
#drawer .top{display:flex;justify-content:space-between;margin-bottom:2px}
#drawer output{color:var(--terra);font-family:var(--head);font-weight:400}
#drawer input[type=range]{width:100%;accent-color:var(--terra)}
#drawer select,#drawer input[type=text],#drawer input[type=number]{width:100%;padding:6px 8px;border:2px solid var(--brown);border-radius:8px;background:#fbf3dc;color:var(--brown);font:inherit}
#drawer .bool{display:flex;align-items:center;gap:8px;cursor:pointer}
#drawer .bool input{width:18px;height:18px;accent-color:var(--terra)}
#drawer .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#drawer button{font:inherit;font-weight:900;color:var(--brown);background:var(--sun);border:2px solid var(--brown);border-radius:8px;padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--brown2)}
#drawer button:active{transform:translate(2px,2px);box-shadow:none}
#drawer .btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#drawer .note{font-weight:700;opacity:.7;font-size:12px;margin-top:2px}
#drawer .two{display:flex;gap:8px;align-items:center}
#drawer .keys{margin-top:16px;font-size:12px;font-weight:700;opacity:.8;line-height:1.5}

/* ---------- pause button + bets ---------- */
#pauseBtn{position:fixed;left:60px;top:10px;z-index:60;width:42px;height:42px;border-radius:50%;border:3px solid var(--brown);background:var(--cream);box-shadow:3px 3px 0 var(--brown2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#pauseBtn svg{width:20px;height:20px}
#pauseBtn .ic-play{display:none}
body.paused #pauseBtn{background:var(--sun)}
body.paused #pauseBtn .ic-play{display:block}
body.paused #pauseBtn .ic-pause{display:none}
body.idle:not(.paused) #pauseBtn{opacity:0}
body.hideui #pauseBtn{display:none}
#pausedTag{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:59;display:none;font-family:var(--head);font-size:22px;letter-spacing:.08em;background:var(--sun);color:var(--brown);border:3px solid var(--brown);border-radius:999px;padding:2px 20px;box-shadow:3px 3px 0 var(--brown2);pointer-events:none}
body.paused #pausedTag{display:block}
#bets{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(40,18,8,.72);font-family:var(--body);color:var(--brown)}
#bets.open{display:flex}
#bets .bx{width:min(980px,96vw);max-height:94vh;display:flex;flex-direction:column;gap:10px;background:var(--cream);border:4px solid var(--brown);border-radius:20px;box-shadow:8px 8px 0 var(--brown2);padding:14px 16px}
#bets .bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#bets .bt{font-family:var(--head);font-size:30px;color:var(--terra);text-shadow:2px 2px 0 var(--sun);line-height:1}
#bets .bs{font-weight:800;font-size:14px;opacity:.8;flex:1;min-width:160px}
#bets input[type=text]{padding:7px 10px;border:2px solid var(--brown);border-radius:10px;background:#fbf3dc;color:var(--brown);font:inherit;font-weight:800;width:200px;max-width:100%}
#bets .lineup{display:flex;gap:6px;flex-wrap:wrap;min-height:36px;padding:6px;background:var(--cream2);border:2px solid var(--tan);border-radius:12px;max-height:96px;overflow-y:auto;align-items:center}
#bets .lineup:empty::before{content:'No countries chosen yet - tap flags below to add votes (empty = random round)';font-weight:800;opacity:.6;font-size:13px}
#bets .chip{display:flex;align-items:center;gap:6px;background:var(--sun);border:2px solid var(--brown);border-radius:999px;padding:1px 10px 1px 2px;font-weight:900;font-size:13px}
#bets .chip img{height:20px;width:30px;object-fit:cover;border:1.5px solid var(--brown);border-radius:3px}
#bets .chip b{font-family:var(--head);font-weight:400;color:var(--terra);font-size:16px}
#bets .grid{flex:1;min-height:120px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;padding:2px}
#bets .tile{display:flex;align-items:center;gap:6px;background:var(--cream2);border:2px solid var(--tan);border-radius:10px;padding:4px 6px;font-weight:900;font-size:14px;user-select:none}
#bets .tile.on{background:var(--sun);border-color:var(--brown)}
#bets .tile .tl{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer}
#bets .tile img{height:24px;width:36px;object-fit:cover;border:2px solid var(--brown);border-radius:4px;flex:none}
#bets .tile .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bets .tile .ctl{display:flex;align-items:center;gap:4px;flex:none}
#bets .tile .ctl span{min-width:24px;text-align:center;font-family:var(--head);font-weight:400;font-size:18px;color:var(--terra)}
#bets button{font:inherit;font-weight:900;color:var(--brown);background:var(--sun);border:2px solid var(--brown);border-radius:8px;padding:4px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--brown2)}
#bets button:active{transform:translate(2px,2px);box-shadow:none}
#bets .tile button{padding:0;width:26px;height:26px;line-height:1;font-size:16px}
#bets .bf{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bets .bf label{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;cursor:pointer;flex:1;min-width:180px}
#bets .bf label input{width:17px;height:17px;accent-color:var(--terra)}
#bets button.go{background:var(--terra);color:var(--cream);font-family:var(--head);font-weight:400;font-size:22px;padding:6px 22px;letter-spacing:.04em}
#bets button.ghost{background:var(--cream2)}

/* ---------- tournament ---------- */
.board.brk{display:none;flex:1}
body.tourn .board.brk{display:flex}
body.tourn .board.live,body.tourn .board.wins{display:none}
#brkWrap{flex:1;min-height:0;background:var(--cream2);border:2px solid var(--tan);border-radius:10px;overflow:hidden}
#brkWrap svg{width:100%;height:100%;display:block}
@keyframes bp{50%{stroke:#f2b632}}
.bcur{animation:bp .9s infinite}
#brk{position:absolute;left:var(--cx);top:var(--cy);transform:translate(-50%,-50%);width:calc(var(--d)*.98);height:calc(var(--d)*.9);display:none;flex-direction:column;gap:calc(var(--d)*.008);z-index:6;background:rgba(244,232,200,.97);border:calc(var(--d)*.008) solid var(--brown);border-radius:calc(var(--d)*.04);box-shadow:calc(var(--d)*.012) calc(var(--d)*.012) 0 var(--brown2);padding:calc(var(--d)*.02);font-family:var(--head);cursor:pointer}
#brk.open{display:flex}
#brk .bk{font-size:calc(var(--d)*.045);color:var(--terra);text-align:center;letter-spacing:.06em;line-height:1}
#brk .bm{font-size:calc(var(--d)*.034);text-align:center;color:var(--brown);display:flex;align-items:center;justify-content:center;gap:calc(var(--d)*.014);flex-wrap:wrap}
#brk .bm img{height:calc(var(--d)*.04);width:calc(var(--d)*.06);object-fit:cover;border:calc(var(--d)*.0035) solid var(--brown);border-radius:calc(var(--d)*.005)}
#brk .bm i{font-style:normal;color:var(--terra)}
#brk #brkBig{flex:1;min-height:0}
#brk #brkBig svg{width:100%;height:100%;display:block}
#brk .bc{text-align:center;font-size:calc(var(--d)*.022);color:var(--brown2)}
#bets .pk{display:none}
#bets.pick .pk{display:inline-block}
#bets.pick .tile .ctl button{display:none}
#bets button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage" class="land">
  <canvas id="cv"></canvas>

  <div id="panel">
   <div class="hdr">
    <div class="title"><span>COUNTRY</span> <span>WARS</span></div>
    <div class="meta">
     <div class="pill" id="pRound">ROUND 1</div>
     <div class="pill sun" id="pAlive">ALIVE 0</div>
     <div class="pill sky" id="pTime">0:00</div>
    </div>
   </div>
   <div class="champ" id="champ"></div>
   <div class="boards">
    <section class="board live"><h3><span>LIVE &middot; STRINGS</span><span class="cols">STR&nbsp;&nbsp;CUT</span></h3><div class="rows" id="liveRows"></div></section>
    <section class="board wins"><h3><span>TOTAL WINS</span></h3><div class="rows" id="winRows"></div></section>
    <section class="board brk"><h3><span>TOURNAMENT BRACKET</span></h3><div id="brkWrap"></div></section>
   </div>
  </div>

  <div id="toasts"></div>

  <div id="intro" class="ov"><div class="card">
   <div class="k" id="iRound">ROUND 1</div>
   <div class="big" id="iBig">WHO WINS?</div>
   <div class="sub" id="iSub">Comment your country!</div>
   <div class="sub" id="iShape" style="margin-top:.2em;color:var(--terra)"></div>
   <div class="count" id="iNum">5</div>
  </div></div>

  <div id="brk"><div class="bk" id="brkStage"></div><div class="bm" id="brkMatch"></div><div id="brkBig"></div><div class="bc" id="brkCount"></div></div>

  <div id="win" class="ov"><div class="card">
   <div class="k" id="wRound">WINNER</div>
   <img id="wFlag" alt="">
   <div class="big" id="wName"></div>
   <div class="sub" id="wSub"></div>
   <div class="sub" id="wVotes" style="margin-top:.3em"></div>
   <div class="sub" id="wNext" style="margin-top:.4em;color:var(--terra)"></div>
  </div></div>
 </div>
</div>

<button id="gear" title="Settings (S)" aria-label="Settings">
 <svg viewBox="0 0 24 24" fill="none" stroke="#4a2f1d" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2.2" fill="#f2b632"/><circle cx="16" cy="12" r="2.2" fill="#f2b632"/><circle cx="10" cy="18" r="2.2" fill="#f2b632"/></svg>
</button>
<button id="pauseBtn" title="Pause / Resume (Space)" aria-label="Pause or resume">
 <svg class="ic-pause" viewBox="0 0 24 24" fill="#4a2f1d"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
 <svg class="ic-play" viewBox="0 0 24 24" fill="#4a2f1d"><path d="M7 4l13 8-13 8z"/></svg>
</button>
<div id="pausedTag">PAUSED</div>
<div id="bets"><div class="bx">
 <div class="bh"><div class="bt" id="bTitle">PLACE YOUR BETS</div><div class="bs" id="bSub"></div><input type="text" id="bSearch" placeholder="Search country..." autocomplete="off"></div>
 <div class="lineup" id="bLineup"></div>
 <div class="grid" id="bGrid"></div>
 <div class="bf">
  <label><input type="checkbox" id="bFill"><span id="bFillTxt">Fill remaining spots with random countries</span></label>
  <button type="button" class="ghost pk" id="bR8">Random 8</button>
  <button type="button" class="ghost pk" id="bR16">Random 16</button>
  <button type="button" class="ghost pk" id="bR32">Random 32</button>
  <button type="button" class="ghost" id="bClear">Clear votes</button>
  <button type="button" class="ghost" id="bSkip">Skip (random round)</button>
  <button type="button" class="go" id="bGo">START ROUND &#9654;</button>
 </div>
</div></div>
<div id="drawer"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, R0=500, WALL=38, PTS=5, DT=1/120;
/* ---- stadium shapes (unit polygons, circumradius 1; null = true circle) ---- */
const _poly=(n,rot)=>{const a=[];for(let k=0;k<n;k++){const t=rot+k*TAU/n;a.push(Math.cos(t),Math.sin(t))}return a};
const _star=()=>{const a=[];for(let k=0;k<10;k++){const t=-Math.PI/2+k*Math.PI/5,q=k%2?0.5:1;a.push(Math.cos(t)*q,Math.sin(t)*q)}return a};
const SHAPES={
 circle:{name:'Circle',poly:null},
 square:{name:'Square',poly:_poly(4,Math.PI/4)},

/* point on the boundary (unit coords) in direction ang from the centre */
function boundaryPoint(ang,P){
 const dx=Math.cos(ang),dy=Math.sin(ang);
 if(!P)return[dx,dy];
 let best=1e9;const n=P.length/2;
 for(let i=0,j=n-1;i<n;j=i++){
  const x1=P[j*2],y1=P[j*2+1],ex=P[i*2]-x1,ey=P[i*2+1]-y1;
  const den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)continue;
  const t=(x1*ey-y1*ex)/den,u=(x1*dy-y1*dx)/den;
  if(t>0&&u>=-1e-9&&u<=1+1e-9&&t<best)best=t;
 }
 if(best>1e8)best=1;
 return[dx*best,dy*best];
}
/* distance to the polygon edge, or -1 when the point is outside */
function polyDist(x,y,P,sc){

 for(let i=0,j=n-1;i<n;j=i++){
  const x1=P[j*2]*sc,y1=P[j*2+1]*sc,x2=P[i*2]*sc,y2=P[i*2+1]*sc,ex=x2-x1,ey=y2-y1,l2=ex*ex+ey*ey;
  let t=l2?((x-x1)*ex+(y-y1)*ey)/l2:0;t=t<0?0:t>1?1:t;
  const dx=x-(x1+ex*t),dy=y-(y1+ey*t),d2=dx*dx+dy*dy;if(d2<bd)bd=d2;
  if((y1>y)!==(y2>y)&&x<(x2-x1)*(y-y1)/(y2-y1)+x1)inside=!inside;
 }

}

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const DEF={count:32,seed:'',random:35,speed:1,cruise:320,keep:1.2,bounce:1,gravity:0,size:1,

if(qp.get('layout')==='vertical')S.ratio='9:16';

/* ================= RNG ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let seedCounter=0;
function pickSeed(){const fs=parseInt(S.seed,10);if(S.seed!==''&&!isNaN(fs))return((fs+seedCounter++)>>>0);return(Math.random()*4294967296)>>>0}

const Snd={ctx:null,master:null,last:{},nb:null,
 init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=S.volume;this.master.connect(this.ctx.destination)}catch(e){}},
 resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
 vol(){if(this.master)this.master.gain.value=S.volume},
 ok(key,gap){const t=performance.now();if(t-(this.last[key]||0)<gap)return false;this.last[key]=t;return true},
 live(){return S.sound&&this.ctx&&this.ctx.state==='running'},
 tone(f,dur,type,vol,slide,delay){if(!this.live())return;const t0=this.ctx.currentTime+(delay||0);const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.03)},
 noise(dur,vol,freq){if(!this.live())return;if(!this.nb){const len=this.ctx.sampleRate;this.nb=this.ctx.createBuffer(1,len,this.ctx.sampleRate);const d=this.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}const t0=this.ctx.currentTime;const s=this.ctx.createBufferSource();s.buffer=this.nb;const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start(t0);s.stop(t0+dur+0.03)},
 wall(){if(!this.ok('wall',50))return;this.tone(170+Math.random()*70,0.09,'sine',0.22,85)},
 cut(){if(!this.ok('cut',40))return;this.noise(0.09,0.4,2800);this.tone(1200,0.07,'square',0.06,600)},
 strip(){this.tone(430,0.32,'sawtooth',0.14,90);this.noise(0.12,0.3,2200)},
 elim(){this.tone(170,0.4,'triangle',0.35,48);this.noise(0.25,0.25,900)},
 tick(){this.tone(660,0.09,'square',0.1)},
 go(){this.tone(990,0.3,'square',0.12)},

};
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>Snd.resume(),{passive:true}));

const FLAGS=new Map();
const WARM=['#c8553d','#e0a030','#4f8a8b','#7a9a3a','#d97b29','#3d7ea6','#a6472f','#8a6b3b','#5b8c5a','#c9893f'];
function hashTint(code){let h=0;for(let i=0;i<code.length;i++)h=(h*31+code.charCodeAt(i))|0;return WARM[Math.abs(h)%WARM.length]}
function dominant(img){
 const c=document.createElement('canvas');c.width=24;c.height=16;
 const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,24,16);
 const d=x.getImageData(0,0,24,16).data;const bins=[];for(let i=0;i<12;i++)bins.push([0,0,0,0]);
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  const v=mx/255,sat=mx?(mx-mn)/mx:0;if(v<0.3||sat<0.35)continue;
  let h;const df=mx-mn;
  if(mx===r)h=((g-b)/df)%6;else if(mx===g)h=(b-r)/df+2;else h=(r-g)/df+4;
  h=(h*60+360)%360;if(h>265&&h<335)continue;
  const bi=Math.floor(h/30);const B=bins[bi];B[0]+=r;B[1]+=g;B[2]+=b;B[3]++;
 }
 let best=null;for(const B of bins){if(B[3]&&(!best||B[3]>best[3]))best=B}
 if(!best)return null;
 return 'rgb('+Math.round(best[0]/best[3])+','+Math.round(best[1]/best[3])+','+Math.round(best[2]/best[3])+')';
}
const SZ=192,K=SZ/128;
function drawSprite(f){
 const c=f.ctx;c.clearRect(0,0,SZ,SZ);c.save();
 c.beginPath();c.arc(SZ/2,SZ/2,SZ/2,0,TAU);c.fillStyle='#4a2f1d';c.fill();
 c.beginPath();c.arc(SZ/2,SZ/2,60*K,0,TAU);c.fillStyle='#f4e8c8';c.fill();
 c.beginPath();c.arc(SZ/2,SZ/2,55*K,0,TAU);c.clip();
 if(f.img){const iw=f.img.naturalWidth||160,ih=f.img.naturalHeight||107;c.drawImage(f.img,iw*0.09,0,iw*0.82,ih,9*K,9*K,110*K,110*K)}
 else{c.fillStyle=f.tint;c.fillRect(0,0,SZ,SZ);c.fillStyle='#f4e8c8';c.font='900 '+(46*K)+'px Nunito,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(f.code.toUpperCase(),SZ/2,SZ/2+4*K)}
 const g=c.createRadialGradient(46*K,42*K,6*K,SZ/2,SZ/2,SZ/2);
 g.addColorStop(0,'rgba(255,255,255,0.32)');g.addColorStop(0.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(40,20,5,0.30)');
 c.fillStyle=g;c.fillRect(0,0,SZ,SZ);c.restore();
}
function getFlag(code){
 let f=FLAGS.get(code);if(f)return f;
 const cv=document.createElement('canvas');cv.width=cv.height=SZ;
 f={code,sprite:cv,ctx:cv.getContext('2d'),img:null,tint:hashTint(code),retry:false};
 FLAGS.set(code,f);drawSprite(f);
 const img=new Image();
 img.onload=()=>{f.img=img;try{const t=dominant(img);if(t)f.tint=t}catch(e){}drawSprite(f)};

}

function ratioValue(){
 const r=S.ratio;if(r==='fill')return 0;

function spawnInShape(n,r,rng){

   const d=polyDist(x,y,P,sc);if(d>=mg)cand.push({x,y,d,a:Math.atan2(y,x)});
  }

 const bands={};for(const c of cand){const k=Math.floor((c.d-mg)/sp);(bands[k]||(bands[k]=[])).push(c)}

  if(out.length>=n)break;

/* ================= PHYSICS ================= */
let GN=1,GC=64,gOff=R0+WALL+10,gHead=new Int32Array(1),segCap=4096,gNext=new Int32Array(segCap),sOwn=new Int32Array(segCap),sK=new Int32Array(segCap),sCoord=new Float32Array(segCap*4);
function growSegs(){
 segCap*=2;
 const a=new Int32Array(segCap);a.set(gNext);gNext=a;
 const b=new Int32Array(segCap);b.set(sOwn);sOwn=b;
 const c=new Int32Array(segCap);c.set(sK);sK=c;
 const d=new Float32Array(segCap*4);d.set(sCoord);sCoord=d;
}
function buildGrid(){
 const need=Math.max(64,Math.ceil(G.baseR*S.size+S.segLen/PTS+8));
 if(need!==GC||gHead.length<2){GC=need;GN=Math.ceil((2*(R0+WALL)+40)/GC)+1;if(gHead.length!==GN*GN)gHead=new Int32Array(GN*GN)}
 gHead.fill(-1);let n=0;const balls=G.balls;
 for(let bi=0;bi<balls.length;bi++){
  const v=balls[bi];if(v.dead||v.s<=0)continue;
  const tr=v.trail,Ln=tr.length>>1;if(!Ln)continue;
  let px=v.x,py=v.y;const rr=v.r*v.r*0.8;
  for(let k=0;k<Ln;k++){
   const qx=tr[(Ln-1-k)*2],qy=tr[(Ln-1-k)*2+1];
   const mx=(px+qx)*0.5,my=(py+qy)*0.5,ddx=mx-v.x,ddy=my-v.y;
   if(ddx*ddx+ddy*ddy>=rr){
    if(n>=segCap)growSegs();
    sOwn[n]=bi;sK[n]=k;const o=n*4;sCoord[o]=px;sCoord[o+1]=py;sCoord[o+2]=qx;sCoord[o+3]=qy;
    const ci=(((my+gOff)/GC)|0)*GN+(((mx+gOff)/GC)|0);
    gNext[n]=gHead[ci];gHead[ci]=n;n++;
   }
   px=qx;py=qy;
  }
 }
}
function rot(b,a){const c=Math.cos(a),s=Math.sin(a);const x=b.vx*c-b.vy*s;b.vy=b.vx*s+b.vy*c;b.vx=x}

function polyWall(b,Rc,jit,rng){
 const P=G.poly,n=P.length/2;
 let bd=1e18,cx=0,cy=0,inside=false;
 for(let i=0,j=n-1;i<n;j=i++){
  const x1=P[j*2]*Rc,y1=P[j*2+1]*Rc,x2=P[i*2]*Rc,y2=P[i*2+1]*Rc,ex=x2-x1,ey=y2-y1,l2=ex*ex+ey*ey;
  let t=l2?((b.x-x1)*ex+(b.y-y1)*ey)/l2:0;t=t<0?0:t>1?1:t;
  const qx=x1+ex*t,qy=y1+ey*t,dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy;
  if(d2<bd){bd=d2;cx=qx;cy=qy}
  if((y1>b.y)!==(y2>b.y)&&b.x<(x2-x1)*(b.y-y1)/(y2-y1)+x1)inside=!inside;
 }
 const d=Math.sqrt(bd);
 if(inside&&d>=b.r)return;
 let nx,ny;
 if(d<1e-6){const l=Math.hypot(cx,cy)||1;nx=cx/l;ny=cy/l}
 else if(inside){nx=(cx-b.x)/d;ny=(cy-b.y)/d}
 else{nx=(b.x-cx)/d;ny=(b.y-cy)/d}
 b.x=cx-nx*b.r;b.y=cy-ny*b.r;
 const vn=b.vx*nx+b.vy*ny;
 if(vn>0){
  b.vx-=(1+S.bounce)*vn*nx;b.vy-=(1+S.bounce)*vn*ny;
  if(jit>0)rot(b,(rng()-0.5)*jit*0.5);

}
function step(dt){
 const rng=G.rng,balls=G.balls,jit=S.random/100;
 G.simT+=dt;G.tick++;
 if(S.sdAfter>0&&G.simT>S.sdAfter){
  if(!G.sd){G.sd=true;toast(null,'SUDDEN DEATH','The arena is shrinking!',true);G.shake=Math.max(G.shake,S.shake?10:0)}
  const minR=Math.max(130,G.baseR*S.size*5);
  G.Rcur=Math.max(minR,R0-(G.simT-S.sdAfter)*S.sdSpeed);
 }
 const Rc=G.Rcur;
 for(const b of balls){
  if(b.dead)continue;
  b.r=G.baseR*S.size;
  if(b.immune>0)b.immune-=dt;
  if(b.wallCd>0)b.wallCd-=dt;
  if(S.gravity)b.vy+=S.gravity*dt;
  if(jit>0)rot(b,(rng()-0.5)*jit*10*dt);
  let sp=Math.hypot(b.vx,b.vy);
  if(sp<1){const a=rng()*TAU;b.vx=Math.cos(a)*S.cruise;b.vy=Math.sin(a)*S.cruise;sp=S.cruise}
  if(S.keep>0){const f=1+(S.cruise/sp-1)*Math.min(1,S.keep*dt);b.vx*=f;b.vy*=f}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(G.poly)polyWall(b,Rc,jit,rng);
  else{
  const Rw=Rc-b.r,d2=b.x*b.x+b.y*b.y;
  if(d2>Rw*Rw){
   const d=Math.sqrt(d2),nx=b.x/d,ny=b.y/d;b.x=nx*Rw;b.y=ny*Rw;
   const vn=b.vx*nx+b.vy*ny;
   if(vn>0){
    b.vx-=(1+S.bounce)*vn*nx;b.vy-=(1+S.bounce)*vn*ny;
    if(jit>0)rot(b,(rng()-0.5)*jit*0.5);
    if(vn>40&&b.wallCd<=0)wallHit(b,nx,ny,nx*Rc,ny*Rc);
   }
  }
  }
 }
 // ball vs ball
 for(let i=0;i<balls.length;i++){
  const a=balls[i];if(a.dead)continue;
  for(let j=i+1;j<balls.length;j++){
   const b=balls[j];if(b.dead)continue;
   const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r;
   if(dx>rr||dx<-rr||dy>rr||dy<-rr)continue;

   const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(vn<0){
    const jm=-(1+S.bounce)*vn/(1/ma+1/mb);
    a.vx-=jm/ma*nx;a.vy-=jm/ma*ny;b.vx+=jm/mb*nx;b.vy+=jm/mb*ny;
    if(jit>0){rot(a,(rng()-0.5)*jit*1.2);rot(b,(rng()-0.5)*jit*1.2)}
   }
  }
 }
 // strings: straight lines from each ball to the wall points where it bounced
 const Rs=G.Rcur;
 for(const v of balls){
  v.sg.length=0;
  if(v.dead)continue;
  for(let i=0;i<v.anc.length;i++){
   const ex=v.anc[i][0]*Rs-v.x,ey=v.anc[i][1]*Rs-v.y,L=Math.hypot(ex,ey)||1;

   if(v===a||v.dead||v.cutStamp===G.tick)continue;

   }
  }
 }
 if(G.state==='play'&&G.alive<=1)onWin();
}

const CONF=['#f2b632','#5ea6d2','#b4533a','#f4e8c8','#7a9a3a','#d97b29'];

 polyPath(c,Rc,P);c.fillStyle='#4f8a38';c.fill();
 c.save();c.clip();
 c.fillStyle='#5a9843';for(let x=-R0;x<R0;x+=160)c.fillRect(x,-R0,80,2*R0);

 c.beginPath();c.moveTo(0,-Rc);c.lineTo(0,Rc);c.stroke();
 c.fillStyle='rgba(244,232,200,0.6)';c.beginPath();c.arc(0,0,9,0,TAU);c.fill();
 c.restore();
 polyPath(c,Rc*0.965,P);c.lineWidth=4;c.strokeStyle='rgba(244,232,200,0.5)';c.stroke();
 polyPath(c,Rc,P);c.lineWidth=5;c.strokeStyle='#8a5a35';c.stroke();
 for(const f of flashes){c.globalAlpha=Math.max(0,1-f.t/0.3)*0.8;c.fillStyle='#f2b632';c.beginPath();c.arc(f.x,f.y,WALL*0.9,0,TAU);c.fill()}

 c.beginPath();c.arc(0,0,95,0,TAU);c.stroke();

 c.fillStyle='rgba(244,232,200,0.6)';c.beginPath();c.arc(0,0,9,0,TAU);c.fill();
 c.restore();
 c.strokeStyle='rgba(244,232,200,0.5)';c.lineWidth=4;c.beginPath();c.arc(0,0,Rc-14,0,TAU);c.stroke();

function drawTails(c){

 for(const d of debris){
  const ox=d.vx*d.t,oy=d.vy*d.t+260*d.t*d.t;

  for(let i=0;i<d.pts.length;i+=2){const x=d.pts[i]+ox,y=d.pts[i+1]+oy;if(i)c.lineTo(x,y);else c.moveTo(x,y)}
  c.strokeStyle='rgba(74,47,29,0.9)';c.lineWidth=d.w+3;c.stroke();

function updateLive(force){
 const alive=G.balls.filter(b=>!b.dead);
 alive.sort((a,b)=>b.s-a.s||b.cuts-a.cuts||a.id-b.id);
 const rows=L.liveRows,rh=L.rowh;
 for(let i=0;i<alive.length;i++){
  const b=alive[i],r=b.row;
  if(r.rank!==i||force){r.rank=i;r.el.style.transform='translateY('+(i*rh)+'px)';r.el.style.opacity=i<rows?1:0;r.rk.textContent=i+1;r.el.classList.toggle('top1',i===0)}

  if(r.strip!==b.stripped){r.strip=b.stripped;r.el.classList.toggle('strip',b.stripped)}
 }
 for(const b of G.balls){
  if(b.dead&&b.row&&!b.row.gone){const r=b.row;r.gone=true;r.el.style.opacity=0;setTimeout(()=>{r.el.style.display='none'},500)}
 }
}

/* ================= LOOP ================= */
let lastT=performance.now(),lbT=0,fpsAcc=0,fpsN=0,fpsT=0;
function update(dt){
 if(G.state==='intro'){
  const prev=Math.ceil(G.timer);G.timer-=dt;G.introT+=dt;
  const cur=Math.ceil(Math.max(0,G.timer));
  if(cur!==prev&&cur>0){Snd.tick();const n=$('#iNum');n.textContent=cur;n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop')}
  if(G.timer<=0){launch();G.state='play';$('#intro').style.display='none';Snd.go()}
 }else{
  let target=1;
  if(G.state==='play'&&S.showdown&&G.alive===2&&!T.active)target=0.5;
  if(G.state==='winner')target=0.4;
  G.slow+=(target-G.slow)*Math.min(1,dt*3);
  if(G.state!=='bets'&&G.state!=='bracket'){
  G.acc+=dt*S.speed*G.slow;let n=0;
  while(G.acc>=DT&&n<30){step(DT);G.acc-=DT;n++}
  if(n>=30)G.acc=0;
  }
  if(G.state==='winner'){
   G.timer-=dt;
   const w=0;setTxt('#wNext',nextLabel());
   G.wTick-=dt;if(G.wTick<=0){G.wTick=0.14;burst((Math.random()-0.5)*R0*1.6,-R0*0.9,lowFx?4:9,null,160)}
   if(G.timer<=0)afterWinner();
  }
  if(G.state==='bracket'){
   G.timer-=dt;setTxt('#brkCount','Fight starts in '+Math.ceil(Math.max(0,G.timer))+'  \u00b7  tap to skip');
   if(G.timer<=0)tournStartMatch();
  }
 }
 // camera
 let tz=1,tx=0,ty=0;
 if(G.state==='play'&&S.showdown&&G.alive===2&&!T.active){
  const a=G.balls.filter(b=>!b.dead);
  if(a.length===2){tz=1.32;tx=(a[0].x+a[1].x)*0.3;ty=(a[0].y+a[1].y)*0.3}
 }else if(G.state==='winner'&&G.winner){tz=1.12;tx=G.winner.x*0.4;ty=G.winner.y*0.4}
 const k=Math.min(1,dt*2.5);G.zoom+=(tz-G.zoom)*k;G.camx+=(tx-G.camx)*k;G.camy+=(ty-G.camy)*k;
 G.shake*=Math.exp(-dt*7);if(G.shake<0.2)G.shake=0;
 updateFx(dt);
 lbT-=dt;if(lbT<=0){lbT=0.12;updateLive(false);updateHud()}
}
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=0.016;if(dt>0.1)dt=0.1;
 fpsAcc+=dt;fpsN++;fpsT+=dt;
 if(fpsAcc>=2){const fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;if(fps<38&&!lowFx&&fpsT>6){lowFx=true;toast(null,'PERFORMANCE MODE','Extra effects reduced',true)}}
 if(!G.paused)update(dt);
 render();
}

   if(it.k==='ratio')window.sel=s;
  }else if(it.t==='bool'){
   row.className='ctl bool';const c=el('input');c.type='checkbox';c.checked=!!S[it.k];
   c.onchange=()=>{S[it.k]=c.checked;saveSettings();if(it.k==='sound')Snd.resume()};row.appendChild(c);row.appendChild(el('span',null,it.label));
  }else if(it.t==='num'){
   row.appendChild(el('div','top','<span>'+it.label+'</span>'));
   const i=el('input');i.type='number';i.min=it.min;i.max=it.max;i.step=it.step;i.value=S[it.k];
   i.oninput=()=>{S[it.k]=clamp(+i.value||it.min,it.min,it.max);saveSettings()};row.appendChild(i);
   if(it.chips){const ch=el('div','chips');for(const v of it.chips){const b=el('button',null,String(v));b.type='button';b.onclick=e=>{e.preventDefault();S[it.k]=v;i.value=v;saveSettings()};ch.appendChild(b)}row.appendChild(ch)}
  }else if(it.t==='text'){
   row.appendChild(el('div','top','<span>'+it.label+'</span>'));
   const i=el('input');i.type='text';i.value=S[it.k];i.oninput=()=>{S[it.k]=i.value.trim();saveSettings();if(it.on)it.on()};row.appendChild(i);
  }
  if(it.note)row.appendChild(el('div','note',it.note));
  d.appendChild(row);
 }
 d.appendChild(el('div','keys','Keys: <b>S</b> settings &middot; <b>H</b> hide all UI (stream mode) &middot; <b>Space</b> pause/resume &middot; <b>N</b> next round &middot; <b>R</b> replay seed &middot; <b>M</b> mute &middot; <b>F</b> fullscreen<br>URL: <b>?ratio=9:16</b> &nbsp;<b>?n=64</b> &nbsp;<b>?seed=123</b> &nbsp;<b>?random=0</b>'));
}

$('#pauseBtn').onclick=togglePause;

/* ---------- votes & bets between rounds ---------- */
const bet={votes:{},order:[],built:false,tiles:{}};
function royaleNext(){if(S.bets)openBets();else{lineupCodes=null;newRound()}}
function afterWinner(){if(T.active)tournNext();else royaleNext()}

function lineupFromVotes(){

 picked.sort((a,b)=>bet.votes[b]-bet.votes[a]||bet.order.indexOf(a)-bet.order.indexOf(b));

}
const pick={sel:[],shuffle:true,max:32};
{const v=lsGet('cwars_pick',[]);if(Array.isArray(v))pick.sel=v.filter(c=>BYCODE[c]).slice(0,pick.max)}
bet.mode='bets';bet.fillR=false;

 }
 $('#bSearch').oninput=()=>{const q=$('#bSearch').value.trim().toLowerCase();for(const k in bet.tiles){const o=bet.tiles[k];o.t.style.display=(!q||o.name.includes(q)||k.includes(q))?'':'none'}};

 $('#bSkip').onclick=()=>{

 };

}
function betAdd(code,d){
 const v=Math.max(0,(bet.votes[code]||0)+d);
 bet.votes[code]=v;
 const i=bet.order.indexOf(code);
 if(v>0&&i<0)bet.order.push(code);
 if(v===0&&i>=0)bet.order.splice(i,1);
 betRefresh();
}

 if(bet.mode==='pick'){pickRefresh();return}
 for(const k in bet.tiles){const o=bet.tiles[k],v=bet.votes[k]||0;o.n.textContent=v;o.t.classList.toggle('on',v>0)}

 for(const c of lu){const ch=el('div','chip');const im=el('img');im.alt='';im.src=flagUrl(c);ch.appendChild(im);const nm=el('span');nm.textContent=BYCODE[c].name;ch.appendChild(nm);ch.appendChild(el('b',null,String(bet.votes[c])));box.appendChild(ch)}
 let tot=0;for(const k in bet.votes)tot+=bet.votes[k];
 const cap=Math.max(2,Math.round(+S.count||32));
 $('#bSub').textContent=lu.length?(lu.length+' countr'+(lu.length===1?'y':'ies')+' chosen \u00b7 '+tot+' votes \u00b7 top '+cap+' by votes play'+(lu.length<2?' (need at least 2, rest random)':'')):'Choose the countries and give them votes (bets). Nothing chosen = random round.';
 $('#bFillTxt').textContent='Fill remaining spots with random countries (up to '+cap+' balls)';

}

}
function closeBets(){$('#bets').classList.remove('open')}
function startFromBets(){
 let lu=lineupFromVotes();
 const cap=Math.max(2,Math.round(+S.count||32));
 const snap={};for(const c of lu)snap[c]=bet.votes[c];
 if($('#bFill').checked&&lu.length<cap){
  const rest=shuffleArr(COUNTRIES.map(c=>c.code).filter(c=>!lu.includes(c)));

 }else if(lu.length>0&&lu.length<2){
  const rest=COUNTRIES.map(c=>c.code).filter(c=>!lu.includes(c));

/* ---------- tournament: picker ---------- */
function bracketInfo(n){let P=2;while(P<n)P*=2;return{P,byes:P-n}}
function pickToggle(code){
 const i=pick.sel.indexOf(code);
 if(i>=0)pick.sel.splice(i,1);
 else if(pick.sel.length<pick.max)pick.sel.push(code);
 else{toast(null,'MAX '+pick.max+' FIGHTERS','Remove one to add another',true);return}
 savePick();pickRefresh();
}
function pickRandom(n){pick.sel=shuffleArr(COUNTRIES.map(c=>c.code)).slice(0,Math.min(n,pick.max));savePick();pickRefresh()}
function pickRefresh(){
 for(const k in bet.tiles){const o=bet.tiles[k],i=pick.sel.indexOf(k);o.n.textContent=i>=0?String(i+1):'';o.t.classList.toggle('on',i>=0)}
 const box=$('#bLineup');box.innerHTML='';
 pick.sel.forEach((c,i)=>{const ch=el('div','chip');const im=el('img');im.alt='';im.src=flagUrl(c);ch.appendChild(im);const nm=el('span');nm.textContent=BYCODE[c].name;ch.appendChild(nm);ch.appendChild(el('b',null,String(i+1)));box.appendChild(ch)});
 const n=pick.sel.length,bi=n>=2?bracketInfo(n):null;
 $('#bSub').textContent=n<2?'Tap flags to choose the fighters (2 to '+pick.max+'). '+n+' chosen.':n+' fighters \u00b7 bracket of '+bi.P+(bi.byes?' \u00b7 '+bi.byes+' bye'+(bi.byes>1?'s':''):'')+' \u00b7 '+Math.log2(bi.P)+' stage'+(bi.P>2?'s':'');
 $('#bFillTxt').textContent='Random bracket order (off = paired in the order you picked)';
 $('#bGo').textContent='START TOURNAMENT \u25B6';$('#bGo').disabled=n<2;
}

 buildBets();bet.mode='pick';
 G.state='bets';G.timer=0;

/* ---------- tournament: bracket engine ---------- */
function stageName(r){
 const m=T.rounds[r]?T.rounds[r].length:1;
 return m===1?'FINAL':m===2?'SEMI-FINAL':m===4?'QUARTER-FINAL':'ROUND OF '+(m*2);
}
function stageShort(r){
 const m=T.rounds[r].length;
 return m===1?'FINAL':m===2?'SEMIS':m===4?'QUARTERS':'R'+(m*2);
}
function tournAdvance(r,m,code){
 const mm=T.rounds[r][m];mm.w=code;
 if(r+1<T.rounds.length){const nm=T.rounds[r+1][m>>1];if(m&1)nm.b=code;else nm.a=code}
}
function startTournament(codes){
 const N=codes.length,P=bracketInfo(N).P,R=Math.log2(P),m0=P/2,B=P-N;
 T.size=P;T.rounds=[];T.champ=null;T.cur=null;
 for(let r=0;r<R;r++)T.rounds.push(Array.from({length:P>>(r+1)},()=>({a:null,b:null,w:null,bye:false})));
 const byeIdx=new Set();for(let k=0;k<B;k++)byeIdx.add(Math.floor((k+0.5)*m0/B));
 let ci=0;
 for(let m=0;m<m0;m++){
  const mm=T.rounds[0][m];
  if(byeIdx.has(m)){mm.a=codes[ci++];mm.b=null;mm.bye=true}
  else{mm.a=codes[ci++];mm.b=codes[ci++]}
 }
 T.active=true;document.body.classList.add('tourn');
 layout();
 for(let m=0;m<m0;m++){const mm=T.rounds[0][m];if(mm.bye)tournAdvance(0,m,mm.a)}
 tournShowBracket();
}
function endTournament(){
 T.active=false;T.cur=null;T.rounds=[];T.champ=null;
 document.body.classList.remove('tourn');$('#brk').classList.remove('open');$('#brkWrap').innerHTML='';
 layout();
}
function findNext(){
 for(let r=0;r<T.rounds.length;r++)for(let m=0;m<T.rounds[r].length;m++){const x=T.rounds[r][m];if(x.w==null&&x.a&&x.b)return{r,m,x}}
 return null;
}

 const nx=findNext();if(!nx)return;
 T.cur=nx.x;T.curR=nx.r;T.curM=nx.m;
 G.state='bracket';G.timer=Math.max(1,+S.brkSec||4);G.balls=[];G.alive=0;G.winner=null;
 parts=[];floaters=[];rings=[];flashes=[];debris=[];
 $('#win').style.display='none';$('#intro').style.display='none';$('#bets').classList.remove('open');
 const A=BYCODE[nx.x.a],Bc=BYCODE[nx.x.b];
 $('#brkStage').textContent=stageName(nx.r)+' \u00b7 MATCH '+(nx.m+1)+' OF '+T.rounds[nx.r].length;
 const bm=$('#brkMatch');bm.innerHTML='';
 const mk=c=>{const i=el('img');i.alt='';i.src=flagUrl(c.code);const sp=el('span');sp.textContent=c.name.toUpperCase();return[i,sp]};
 for(const x of mk(A))bm.appendChild(x);bm.appendChild(el('i',null,'VS'));for(const x of mk(Bc))bm.appendChild(x);

function onTournWin(w){
 const r=T.curR,isFinal=r===T.rounds.length-1;
 tournAdvance(r,T.curM,w.c.code);
 G.winner=w;G.state='winner';
 Snd.win();if(S.shake)G.shake=Math.max(G.shake,16);
 burst(w.x,w.y,lowFx?40:110,w.flag.tint,520);
 $('#wFlag').src=flagUrl(w.c.code);$('#wVotes').textContent='';
 if(isFinal){
  T.champ=w.c.code;
  stats.wins[T.champ]=(stats.wins[T.champ]||0)+1;
  if(stats.champ===T.champ)stats.streak++;else{stats.champ=T.champ;stats.streak=1}
  saveStats();updateWins();updateChamp();
  $('#wRound').textContent='TOURNAMENT CHAMPION';
  $('#wName').textContent=w.c.name.toUpperCase()+' WINS IT ALL!';
  $('#wSub').textContent=stats.streak>1?stats.streak+' TITLES IN A ROW!':(stats.wins[T.champ]+(stats.wins[T.champ]===1?' TOTAL WIN':' TOTAL WINS'));
  G.timer=S.winner+4;
 }else{
  $('#wRound').textContent=stageName(r)+' WINNER';
  $('#wName').textContent=w.c.name.toUpperCase()+' ADVANCES!';
  $('#wSub').textContent='Into the '+stageName(r+1).toLowerCase();

 }

  T.active=false;T.cur=null;T.rounds=[];T.champ=null;

function esc(t){return String(t).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function bracketSVG(big){
 if(!T.rounds.length)return '';
 const P=T.size,R=T.rounds.length;
 const colW=big?196:104,rowH=big?(P>16?30:P>8?38:46):(P>16?28:P>8?34:44);
 const sw=colW-(big?34:18),hh=Math.min(rowH-4,big?34:26),fw=big?30:22,fh=big?20:15,fs=big?(P>16?13:17):13;
 const top=big?26:18,W=(R+1)*colW,H=P*rowH+top;
 const cur=(T.cur&&T.cur.w==null)?T.cur:null;
 const cy=(k,i)=>top+(i+0.5)*(1<<k)*rowH;
 const codeAt=(k,i)=>{if(k===R)return T.rounds[R-1][0].w;const mm=T.rounds[k][i>>1];return(i&1)?mm.b:mm.a};
 let con='',sl='',lab='';
 for(let k=0;k<=R;k++){
  const lx=k*colW+4+sw/2;
  lab+='<text x="'+lx+'" y="'+(top*0.68)+'" text-anchor="middle" font-family="Lilita One,Arial Black,sans-serif" font-size="'+(big?15:11)+'" fill="#b4533a">'+(k===R?'WINNER':stageShort(k))+'</text>';
  for(let i=0;i<(P>>k);i++){
   const c=codeAt(k,i),y=cy(k,i)-hh/2,x=k*colW+4;
   let st='empty';
   if(c){if(k===R)st='champ';else{const mm=T.rounds[k][i>>1];st=mm===cur?'cur':mm.w==null?'pend':mm.w===c?'won':'lost'}}
   const fill={won:'#f2b632',lost:'#e3d3aa',cur:'#fff2d2',pend:'#ecdcb0',champ:'#f2b632',empty:'none'}[st];
   const stroke={won:'#4a2f1d',lost:'#b8975a',cur:'#b4533a',pend:'#b8975a',champ:'#4a2f1d',empty:'#b8975a'}[st];
   sl+='<rect class="'+(st==='cur'?'bcur':'')+'" x="'+x+'" y="'+y+'" width="'+sw+'" height="'+hh+'" rx="6" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(st==='cur'?3:2)+'"'+(st==='empty'?' stroke-dasharray="3 3"':'')+'/>';
   if(c){
    const op=st==='lost'?0.5:1,nm=BYCODE[c].name,txt=big?(nm.length>15?nm.slice(0,14)+'.':nm):c.toUpperCase();
    sl+='<image href="'+flagUrl(c)+'" x="'+(x+5)+'" y="'+(y+(hh-fh)/2)+'" width="'+fw+'" height="'+fh+'" preserveAspectRatio="xMidYMid slice" opacity="'+op+'"/>';
    sl+='<text x="'+(x+fw+11)+'" y="'+(y+hh/2)+'" dominant-baseline="central" font-family="Nunito,Arial,sans-serif" font-weight="900" font-size="'+fs+'" fill="#4a2f1d" opacity="'+op+'"'+(st==='lost'?' text-decoration="line-through"':'')+'>'+esc(txt)+'</text>';
   }else{
    sl+='<text x="'+(x+sw/2)+'" y="'+(y+hh/2)+'" text-anchor="middle" dominant-baseline="central" font-family="Nunito,Arial,sans-serif" font-weight="900" font-size="'+(fs-1)+'" fill="#b8975a">'+(k===0?'BYE':'?')+'</text>';
   }
  }
  if(k<R){
   for(let j=0;j<(P>>(k+1));j++){
    const ya=cy(k,2*j),yb=cy(k,2*j+1),yn=cy(k+1,j),x1=k*colW+4+sw,x2=(k+1)*colW+4,mid=(x1+x2)/2;
    const done=T.rounds[k][j].w!=null;
    con+='<path d="M'+x1+' '+ya+'H'+mid+'V'+yb+'M'+x1+' '+yb+'H'+mid+'M'+mid+' '+yn+'H'+x2+'" fill="none" stroke="'+(done?'#4a2f1d':'#b8975a')+'" stroke-width="2" stroke-linecap="round"/>';
   }
  }
 }
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+lab+con+sl+'</svg>';
}
function renderBrackets(){
 if(!T.active)return;
 $('#brkWrap').innerHTML=bracketSVG(false);
 $('#brkBig').innerHTML=bracketSVG(true);
}
$('#brk').onclick=()=>{if(G.state==='bracket')tournStartMatch()};

$('#gear').onclick=()=>$('#drawer').classList.toggle('open');
addEventListener('keydown',e=>{
 if(/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||'')) && e.target.type!=='range' && e.target.type!=='checkbox')return;
 const k=e.key.toLowerCase();
 if(k==='s')$('#drawer').classList.toggle('open');
 else if(k==='h'){document.body.classList.toggle('hideui')}
 else if(k===' '){e.preventDefault();if(G.state!=='bets')togglePause()}
 else if(k==='n'){if(G.state!=='bets')nextRound()}
 else if(k==='r'){if(!T.active&&G.state!=='bets')newRound(G.seed)}
 else if(k==='m'){S.sound=!S.sound;saveSettings();buildDrawer()}
 else if(k==='f'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
});
let idleT=0;

addEventListener('mousemove',wake);addEventListener('pointerdown',wake);wake();
addEventListener('resize',layout);

/* ================= BOOT ================= */
window.CW={G,S,L,stats};
buildDrawer();
layout();
updateChamp();
if(S.mode==='tourn')applyMode();else newRound();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildBg()});
requestAnimationFrame(t=>{lastT=t;frame(t)});
})();
