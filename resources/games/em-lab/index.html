<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e20">
<title>EM Field Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 顶部栏 ============ -->
  <header class="topbar">
    <h1 class="logo">EM Field Lab</h1>
    <a class="btn-back" href="../../index.html">← Back to portal</a>
  </header>

  <!-- ============ 实验标签栏 ============ -->
  <nav class="tabbar">
    <button class="tab-btn active" type="button" data-tab="charge">① Point-Charge Field</button>
    <button class="tab-btn" type="button" data-tab="current">② Current and Magnetic Field</button>
    <button class="tab-btn" type="button" data-tab="magnet">③ Magnet Interaction</button>
    <button class="tab-btn" type="button" data-tab="ampere">④ Ampère's Law</button>
  </nav>

  <main class="stage">

    <!-- 公式与操作提示 -->
    <section class="glass formula-bar">
      <div class="formula" id="formula"></div>
      <div class="hint" id="hint"></div>
    </section>

    <!-- ============ 工具栏（随标签切换） ============ -->
    <section class="glass tool-panel">

      <!-- 标签一：点电荷电场 -->
      <div class="tool-page active" data-page="charge">
        <span class="tool-label">Tools</span>
        <div class="seg">
          <button class="seg-btn active" type="button" data-group="chTool" data-value="select">Select / Drag</button>
          <button class="seg-btn" type="button" data-group="chTool" data-value="addp">Add + Positive charge</button>
          <button class="seg-btn" type="button" data-group="chTool" data-value="addn">Add - Negative charge</button>
        </div>
        <span class="tool-label">Test charge</span>
        <div class="seg">
          <button class="seg-btn active" type="button" data-group="chProbe" data-value="1">+ Positive</button>
          <button class="seg-btn" type="button" data-group="chProbe" data-value="-1">- Negative</button>
          <button class="seg-btn" type="button" data-group="chProbe" data-value="0">Neutral</button>
        </div>
        <button class="btn" id="chProbeBtn" type="button">Place / reset test charge</button>
        <button class="btn toggle-on" id="chPotBtn" type="button">Equipotentials: On</button>
        <button class="btn btn-warn" id="chDelBtn" type="button">Delete selected</button>
      </div>

      <!-- 标签二：电流与磁场 -->
      <div class="tool-page" data-page="current">
        <span class="tool-label">Wire tools</span>
        <div class="seg">
          <button class="seg-btn active" type="button" data-group="cuTool" data-value="select">Select / Drag</button>
          <button class="seg-btn" type="button" data-group="cuTool" data-value="addOut">Add ⊙ out of page (red)</button>
          <button class="seg-btn" type="button" data-group="cuTool" data-value="addIn">Add ⊗ into page (blue)</button>
        </div>
        <button class="btn" id="cuNeedleBtn" type="button">Add compass needle</button>
        <button class="btn btn-warn" id="cuDelBtn" type="button">Delete selected</button>
      </div>

      <!-- 标签三：磁铁相互作用 -->
      <div class="tool-page" data-page="magnet">
        <span class="tool-label">Selected magnet</span>
        <button class="btn" id="mgRotLBtn" type="button">Rotate 15° counterclockwise</button>
        <button class="btn" id="mgRotRBtn" type="button">Rotate 15° clockwise</button>
        <button class="btn" id="mgFlipBtn" type="button">Flip 180°</button>
        <button class="btn" id="mgReseedBtn" type="button">Re-scatter filings</button>
      </div>

      <!-- 标签四：安培环路定理 -->
      <div class="tool-page" data-page="ampere">
        <span class="tool-label">Wire tools</span>
        <div class="seg">
          <button class="seg-btn active" type="button" data-group="amTool" data-value="select">Select / Drag</button>
          <button class="seg-btn" type="button" data-group="amTool" data-value="addOut">Add ⊙ out of page</button>
          <button class="seg-btn" type="button" data-group="amTool" data-value="addIn">Add ⊗ into page</button>
        </div>
        <label class="slider-label">Current |I| = <b id="amMagVal">1.0</b>
          <input class="slider" id="amMag" type="range" min="0.2" max="3" step="0.1" value="1">
        </label>
        <span class="tool-label">Closed loop</span>
        <div class="seg">
          <button class="seg-btn active" type="button" data-group="amShape" data-value="circle">Circle</button>
          <button class="seg-btn" type="button" data-group="amShape" data-value="rect">Rectangle</button>
        </div>
        <label class="slider-label">Loop size = <b id="amSizeVal">110</b> px
          <input class="slider" id="amSize" type="range" min="50" max="200" step="2" value="110">
        </label>
        <button class="btn btn-warn" id="amDelBtn" type="button">Delete selected wire</button>
      </div>

      <!-- 通用控制 -->
      <div class="common-ctl">
        <span class="tool-label">Grid density</span>
        <div class="seg seg-small">
          <button class="seg-btn" type="button" data-group="density" data-value="0">Sparse</button>
          <button class="seg-btn active" type="button" data-group="density" data-value="1">Medium</button>
          <button class="seg-btn" type="button" data-group="density" data-value="2">Dense</button>
        </div>
        <button class="btn" id="pauseBtn" type="button">Pause</button>
        <button class="btn" id="resetBtn" type="button">Reset experiment</button>
      </div>
    </section>

    <!-- ============ 画布区域 ============ -->
    <section class="canvas-wrap glass">
      <canvas id="cv"></canvas>
      <div class="readout" id="readout"></div>
    </section>

  </main>

  <script src="game.js"></script>
</body>
</html>
