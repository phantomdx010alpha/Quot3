<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merge Numbers 2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 顶部栏：左标题，右返回门户 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">2048</span>
      <h1 class="brand-title">Merge Numbers 2048</h1>
    </div>
    <a class="back-link" href="../../index.html">← Back to portal</a>
  </header>

  <main class="stage">

    <!-- 计分与操作区 -->
    <section class="hud panel">
      <div class="score-box" id="scoreBox">
        <span class="score-label">Score</span>
        <span class="score-value" id="scoreValue">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Best</span>
        <span class="score-value" id="bestValue">0</span>
      </div>
      <div class="hud-actions">
        <button class="btn btn-ghost" id="undoBtn" type="button">Undo</button>
        <button class="btn btn-primary" id="newBtn" type="button">New game</button>
      </div>
    </section>

    <!-- 棋盘 -->
    <section class="board-wrap">
      <div class="board" id="board" aria-label="2048 game board">
        <div class="cell-layer" id="cellLayer"></div>
        <div class="tile-layer" id="tileLayer"></div>
        <div class="fx-layer" id="fxLayer"></div>

        <!-- 胜利 / 失败遮罩 -->
        <div class="overlay hidden" id="overlay">
          <div class="overlay-card panel">
            <h2 class="overlay-title" id="overlayTitle"></h2>
            <p class="overlay-text" id="overlayText"></p>
            <div class="overlay-actions">
              <button class="btn btn-primary" id="continueBtn" type="button">Keep going</button>
              <button class="btn btn-ghost" id="overlayNewBtn" type="button">New game</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 底部操作说明 -->
    <footer class="tips">Arrow keys / WASD / swipe to move tiles · Equal numbers merge and double · Each tile can merge only once per move</footer>
  </main>

</div>
<script src="game.js"></script>
</body>
</html>
